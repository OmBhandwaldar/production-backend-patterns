# Local infra only. In production these are managed services (RDS/Aurora, ElastiCache)
# — you never run your primary datastore in the same lifecycle as your app.
services:
  postgres:
    image: postgres:16-alpine
    container_name: approval_pg
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: approval
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # healthcheck lets `depends_on: condition: service_healthy` work,
    # so the app doesn't start connecting before Postgres is ready.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d approval"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: approval_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
